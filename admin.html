<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz DEC · Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  :root{--red:#C0392B;--red-dark:#96281B;--dark:#1A1A2E;--gray:#2C2C3E;--white:#FFFFFF;--muted:#8B8B9A;--gold:#F4C842;--silver:#B0B8C1;--bronze:#CD7F32;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--dark);color:white;min-height:100vh;display:flex;flex-direction:column;}
  .header{background:var(--red);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;}
  .header-logo{font-size:0.8rem;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:white;}
  .header-badge{font-size:0.7rem;font-weight:700;background:rgba(0,0,0,0.3);color:white;padding:0.3rem 0.7rem;border-radius:20px;letter-spacing:0.1em;}
  .screen{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:2rem;gap:2rem;text-align:center;}
  .screen.active{display:flex;}
  .btn{padding:1rem 2rem;background:var(--red);color:white;border:none;border-radius:12px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:background 0.2s;}
  .btn:hover{background:var(--red-dark);}
  .btn-dark{background:var(--gray);}
  .btn-dark:hover{background:#3a3a5c;}
  .title{font-size:2rem;font-weight:800;}
  .title span{color:#E74C3C;}
  .url{font-size:1rem;font-weight:700;color:var(--red);background:rgba(192,57,43,0.1);border:1.5px solid var(--red);padding:0.6rem 1.5rem;border-radius:8px;}
  .count strong{font-size:3.5rem;font-weight:900;display:block;color:white;}
  .count{color:var(--muted);}
  .finished{font-size:1.1rem;color:var(--muted);}
  .finished strong{color:white;font-size:1.5rem;}
  .podium-stage{display:flex;align-items:flex-end;justify-content:center;gap:1.5rem;}
  .podium-place{display:flex;flex-direction:column;align-items:center;gap:0.8rem;}
  .podium-medal{font-size:2rem;}
  .podium-name{font-size:1rem;font-weight:700;max-width:140px;}
  .podium-pts{font-size:0.85rem;color:var(--muted);}
  .podium-block{border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;width:120px;}
  .place-1 .podium-block{height:160px;background:var(--gold);color:var(--dark);}
  .place-2 .podium-block{height:110px;background:var(--silver);color:var(--dark);}
  .place-3 .podium-block{height:80px;background:var(--bronze);color:white;}
  .podium-list{width:100%;max-width:500px;display:flex;flex-direction:column;gap:0.5rem;}
  .podium-row{display:flex;align-items:center;gap:0.8rem;padding:0.8rem 1rem;border-radius:10px;background:var(--gray);}
  .podium-row-rank{min-width:2rem;text-align:center;}
  .podium-row-name{flex:1;font-weight:600;}
  .podium-row-score{color:var(--muted);font-weight:700;}
</style>
</head>
<body>
<div class="header">
  <div class="header-logo">DEC Argentina · Quiz</div>
  <div class="header-badge">PRESENTADOR</div>
</div>

<div id="screen-waiting" class="screen active">
  <div class="title">Quiz <span>DEC Argentina</span></div>
  <div class="url" id="p-url">Cargando...</div>
  <div class="count"><strong id="p-count">0</strong>participantes conectados</div>
  <button class="btn" onclick="presenterStart()">Empezar quiz →</button>
</div>

<div id="screen-playing" class="screen">
  <div class="title">Quiz en curso</div>
  <div class="finished">Terminaron: <strong id="pp-finished">0 / 0</strong></div>
  <div style="color:var(--muted);font-size:0.95rem">Los participantes avanzan a su ritmo.</div>
  <button class="btn" onclick="presenterShowResults()">Ver podio ahora →</button>
</div>

<div id="screen-podium" class="screen">
  <div class="title">🏆 <span style="color:var(--gold)">Podio final</span></div>
  <div class="podium-stage" id="podium-stage"></div>
  <div class="podium-list" id="podium-list"></div>
  <button class="btn btn-dark" onclick="presenterReset()">Nueva partida</button>
</div>

<script>
let ws;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function send(msg){if(ws&&ws.readyState===1)ws.send(JSON.stringify(msg));}

function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}`);
  ws.onopen=()=>{document.getElementById('p-url').textContent=location.host;};
  ws.onmessage=e=>handleMessage(JSON.parse(e.data));
  ws.onclose=()=>setTimeout(connect,2000);
}

function presenterStart(){send({type:'presenter_start'});}
function presenterShowResults(){send({type:'presenter_show_results'});}
function presenterReset(){send({type:'presenter_reset'});}

function showPodium(leaderboard){
  show('screen-podium');
  const medals=['🥇','🥈','🥉'];
  const top3=leaderboard.slice(0,3);
  const order=top3.length>=3?[top3[1],top3[0],top3[2]]:top3.length===2?[top3[1],top3[0]]:[top3[0]];
  const classes=top3.length>=3?['place-2','place-1','place-3']:top3.length===2?['place-2','place-1']:['place-1'];
  const nums=top3.length>=3?['2','1','3']:top3.length===2?['2','1']:['1'];
  const heights={'place-1':'160px','place-2':'110px','place-3':'80px'};
  const stage=document.getElementById('podium-stage');stage.innerHTML='';
  order.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className=`podium-place ${classes[i]}`;
    el.innerHTML=`<div class="podium-medal">${medals[parseInt(nums[i])-1]}</div><div class="podium-name">${p.name}</div><div class="podium-pts">${p.score} pts</div><div class="podium-block" style="height:${heights[classes[i]]}">${nums[i]}</div>`;
    stage.appendChild(el);
  });
  const list=document.getElementById('podium-list');list.innerHTML='';
  leaderboard.forEach((p,i)=>{
    const row=document.createElement('div');row.className='podium-row';
    row.innerHTML=`<div class="podium-row-rank">${i<3?medals[i]:i+1}</div><div class="podium-row-name">${p.name}</div><div class="podium-row-score">${p.score} pts</div>`;
    list.appendChild(row);
  });
}

function handleMessage(msg){
  if(msg.type==='player_count'){const el=document.getElementById('p-count');if(el)el.textContent=msg.count;}
  if(msg.type==='game_start')show('screen-playing');
  if(msg.type==='player_finished'){const el=document.getElementById('pp-finished');if(el)el.textContent=`${msg.count} / ${msg.total}`;}
  if(msg.type==='show_results')showPodium(msg.leaderboard);
  if(msg.type==='reset')show('screen-waiting');
}

connect();
</script>
</body>
</html>
