<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz DEC Argentina</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  :root { --red:#C0392B; --red-dark:#96281B; --dark:#1A1A2E; --light:#F8F8F8; --white:#FFFFFF; --muted:#8B8B9A; --border:#E2E2E8; --green:#27AE60; --wrong:#E74C3C; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:var(--light); color:var(--dark); min-height:100vh; display:flex; flex-direction:column; }
  .header { background:var(--red); padding:1rem 1.5rem; }
  .header-logo { font-size:0.8rem; font-weight:800; letter-spacing:0.2em; text-transform:uppercase; color:white; }
  .screen { display:none; flex:1; flex-direction:column; padding:1.5rem; gap:1.2rem; }
  .screen.active { display:flex; }
  .btn { padding:1rem 1.5rem; background:var(--red); color:white; border:none; border-radius:12px; font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer; width:100%; transition:background 0.2s; }
  .btn:hover { background:var(--red-dark); }
  .input { width:100%; padding:1rem 1.2rem; border:2px solid var(--border); border-radius:12px; font-family:inherit; font-size:1rem; font-weight:500; color:var(--dark); background:var(--white); outline:none; transition:border-color 0.2s; }
  .input:focus { border-color:var(--red); }
  #screen-join .join-title { font-size:1.5rem; font-weight:700; line-height:1.3; }
  #screen-join .join-title span { color:var(--red); }
  #screen-ready { align-items:center; justify-content:center; text-align:center; gap:1.5rem; }
  .ready-name { font-size:1.4rem; font-weight:700; }
  .ready-name span { color:var(--red); }
  .ready-sub { color:var(--muted); font-size:0.95rem; line-height:1.6; }
  .dot-row { display:flex; gap:0.5rem; justify-content:center; }
  .dot { width:10px; height:10px; background:var(--red); border-radius:50%; animation:dp 1.2s infinite; }
  .dot:nth-child(2){animation-delay:0.2s;} .dot:nth-child(3){animation-delay:0.4s;}
  @keyframes dp{0%,80%,100%{transform:scale(0.6);opacity:0.4;}40%{transform:scale(1);opacity:1;}}
  .q-header { display:flex; align-items:center; justify-content:space-between; }
  .q-num { font-size:0.75rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:var(--red); }
  .q-timer { font-size:1.5rem; font-weight:800; color:var(--dark); }
  .q-timer.urgent { color:var(--red); }
  .progress-track { height:4px; background:var(--border); border-radius:4px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--red); border-radius:4px; transition:width 0.4s; }
  .q-text { font-size:1.15rem; font-weight:600; line-height:1.45; }
  .options { display:flex; flex-direction:column; gap:0.7rem; }
  .option { padding:1rem 1.2rem; border:2px solid var(--border); border-radius:12px; background:var(--white); cursor:pointer; display:flex; align-items:center; gap:0.8rem; font-family:inherit; text-align:left; width:100%; transition:all 0.15s; }
  .option:hover:not(:disabled){border-color:var(--red);background:rgba(192,57,43,0.04);}
  .option.selected{border-color:var(--red);background:rgba(192,57,43,0.08);}
  .option:disabled{cursor:default;}
  .opt-letter{width:28px;height:28px;border-radius:6px;background:var(--light);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8rem;color:var(--dark);flex-shrink:0;}
  .option.selected .opt-letter{background:var(--red);border-color:var(--red);color:white;}
  .opt-text{font-size:0.95rem;color:var(--dark);line-height:1.35;}
  #screen-between{align-items:center;justify-content:center;text-align:center;gap:1rem;}
  .between-icon{font-size:3.5rem;} .between-msg{font-size:1.2rem;font-weight:700;}
  #screen-waiting-results{align-items:center;justify-content:center;text-align:center;gap:1.5rem;}
  .results-title{font-size:1.4rem;font-weight:800;text-align:center;}
  .results-score{text-align:center;color:var(--muted);font-size:0.95rem;}
  .results-score strong{display:block;font-size:2.2rem;font-weight:800;color:var(--red);}
  .result-list{display:flex;flex-direction:column;gap:0.5rem;}
  .result-row{display:flex;align-items:flex-start;gap:0.8rem;padding:0.9rem 1rem;border-radius:10px;background:var(--white);border:1.5px solid var(--border);}
  .result-row.correct{border-color:var(--green);} .result-row.wrong{border-color:var(--wrong);}
  .result-icon{font-size:1.1rem;flex-shrink:0;margin-top:0.1rem;}
  .result-q{font-size:0.85rem;color:var(--dark);line-height:1.4;flex:1;}
  .result-q .correct-ans{font-size:0.8rem;color:var(--green);font-weight:600;margin-top:0.3rem;}
  .result-pts{font-size:0.85rem;font-weight:700;color:var(--muted);flex-shrink:0;}
  .result-row.correct .result-pts{color:var(--green);}
</style>
</head>
<body>
<div class="header"><div class="header-logo">DEC Argentina · Quiz</div></div>

<div id="screen-join" class="screen active">
  <div class="join-title">¿Cuánto sabés de <span>DEC Argentina</span>?</div>
  <input class="input" id="name-input" type="text" placeholder="Tu nombre" maxlength="30">
  <button class="btn" onclick="joinGame()">Entrar al quiz</button>
</div>

<div id="screen-ready" class="screen">
  <div class="ready-name">Listo, <span id="display-name"></span>!</div>
  <div class="ready-sub">Esperá la señal del presentador<br>para que todos empiecen juntos.</div>
  <div class="dot-row"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<div id="screen-question" class="screen">
  <div class="q-header">
    <div class="q-num" id="q-num">Pregunta 1 de 8</div>
    <div class="q-timer" id="q-timer">20</div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="q-progress" style="width:12.5%"></div></div>
  <div class="q-text" id="q-text"></div>
  <div class="options" id="q-options"></div>
</div>

<div id="screen-between" class="screen">
  <div class="between-icon">⏳</div>
  <div class="between-msg">Respuesta registrada</div>
</div>

<div id="screen-waiting-results" class="screen">
  <div style="font-size:3rem">🏁</div>
  <div style="font-size:1.3rem;font-weight:700">¡Terminaste!</div>
  <div style="color:var(--muted);font-size:0.9rem">Esperando el podio final...</div>
  <div class="dot-row"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<div id="screen-results" class="screen">
  <div class="results-title">🎉 Tus resultados</div>
  <div class="results-score">Puntaje total<strong id="final-score">0</strong></div>
  <div class="result-list" id="result-list"></div>
</div>

<script>
const QUESTIONS=[
  {q:"¿Cuántas empresas fundadoras tiene ADEC Argentina?",opts:["5","7","9","12"],correct:2},
  {q:"¿Cuál es la definición de Experiencia de Cliente según el framework de DEC?",opts:["El nivel de satisfacción que reporta un cliente tras una compra","El recuerdo que se genera en la mente del consumidor como consecuencia de su relación con la marca","La suma de todas las interacciones digitales entre cliente y empresa","La percepción del cliente en los momentos de contacto con el servicio"],correct:1},
  {q:"¿Cuántas «íes» componen el framework Onda del Cliente® de DEC?",opts:["3","4","5","6"],correct:2},
  {q:"¿En qué país nació la red DEC hace más de 10 años?",opts:["Argentina","México","España","Chile"],correct:2},
  {q:"En el framework Onda del Cliente®, ¿qué «i» se refiere a gestionar todos los momentos que el cliente vive con la marca?",opts:["Identidad única","Impulso organizativo","Interacciones","Interpretación y acción"],correct:2},
  {q:"¿Qué métrica se usa clásicamente para medir la lealtad de los clientes y la probabilidad de recomendación?",opts:["CSAT","CES","NPS","CLV"],correct:2},
  {q:"Según DEC, implantar Experiencia de Cliente implica principalmente:",opts:["Invertir más en atención al cliente y programas de fidelización","Mejorar la oferta de productos y servicios","Una transformación en la forma de pensar y actuar de toda la organización, empezando por sus líderes","Digitalizar todos los puntos de contacto con el cliente"],correct:2},
  {q:"¿Cuál de estas afirmaciones sobre la Experiencia de Empleado es correcta según la filosofía DEC?",opts:["Es independiente de la experiencia del cliente y se gestiona por separado","Solo aplica a empleados que tienen contacto directo con clientes","Los empleados difícilmente pueden entregar una buena experiencia si no la viven primero dentro de la organización","Se mide exclusivamente con encuestas de clima laboral"],correct:2}
];
const LETTERS=['A','B','C','D'];
const TIME=20;
let ws,myScore=0,myAnswers=[],currentQ=0,timerVal=TIME,timerInt=null,answered=false;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}`);
  ws.onmessage=e=>handleMessage(JSON.parse(e.data));
  ws.onclose=()=>setTimeout(connect,2000);
}

function send(msg){if(ws&&ws.readyState===1)ws.send(JSON.stringify(msg));}

function joinGame(){
  const name=document.getElementById('name-input').value.trim();
  if(!name)return;
  document.getElementById('display-name').textContent=name;
  send({type:'join',name});
}

function startPlaying(){myScore=0;myAnswers=[];currentQ=0;showQuestion();}

function showQuestion(){
  show('screen-question');answered=false;
  const q=QUESTIONS[currentQ];
  document.getElementById('q-num').textContent=`Pregunta ${currentQ+1} de ${QUESTIONS.length}`;
  document.getElementById('q-progress').style.width=`${((currentQ+1)/QUESTIONS.length)*100}%`;
  document.getElementById('q-text').textContent=q.q;
  const optsEl=document.getElementById('q-options');
  optsEl.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='option';
    btn.innerHTML=`<div class="opt-letter">${LETTERS[i]}</div><div class="opt-text">${opt}</div>`;
    btn.onclick=()=>selectAnswer(i,btn);
    optsEl.appendChild(btn);
  });
  timerVal=TIME;clearInterval(timerInt);
  const timerEl=document.getElementById('q-timer');
  timerEl.classList.remove('urgent');timerEl.textContent=timerVal;
  timerInt=setInterval(()=>{
    timerVal--;timerEl.textContent=timerVal;
    if(timerVal<=5)timerEl.classList.add('urgent');
    if(timerVal<=0){clearInterval(timerInt);if(!answered){answered=true;myAnswers.push({idx:currentQ,answer:-1,correct:false,points:0});goNext();}}
  },1000);
}

function selectAnswer(idx,btnEl){
  if(answered)return;answered=true;clearInterval(timerInt);
  document.querySelectorAll('.option').forEach(b=>b.disabled=true);
  btnEl.classList.add('selected');
  const isCorrect=idx===QUESTIONS[currentQ].correct;
  const pts=isCorrect?100+timerVal*5:0;
  myScore+=pts;myAnswers.push({idx:currentQ,answer:idx,correct:isCorrect,points:pts});
  goNext();
}

function goNext(){
  show('screen-between');
  setTimeout(()=>{
    currentQ++;
    if(currentQ<QUESTIONS.length){showQuestion();}
    else{send({type:'submit_score',score:myScore});show('screen-waiting-results');}
  },1500);
}

function showPlayerResults(){
  show('screen-results');
  document.getElementById('final-score').textContent=myScore;
  const list=document.getElementById('result-list');list.innerHTML='';
  QUESTIONS.forEach((q,i)=>{
    const ans=myAnswers.find(a=>a.idx===i);
    const isCorrect=ans&&ans.correct;
    const row=document.createElement('div');
    row.className=`result-row ${isCorrect?'correct':'wrong'}`;
    row.innerHTML=`<div class="result-icon">${isCorrect?'✅':'❌'}</div><div class="result-q">${q.q}${!isCorrect?`<div class="correct-ans">Correcta: ${q.opts[q.correct]}</div>`:''}</div><div class="result-pts">${ans?ans.points:0} pts</div>`;
    list.appendChild(row);
  });
}

function handleMessage(msg){
  if(msg.type==='joined')show('screen-ready');
  if(msg.type==='game_start')startPlaying();
  if(msg.type==='show_results')showPlayerResults();
  if(msg.type==='reset'){myScore=0;myAnswers=[];show('screen-join');}
}

connect();
</script>
</body>
</html>
